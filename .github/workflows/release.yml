name: Windows and Ubuntu releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: ubuntu-x64
            flags: --deb
          - os: windows-2022
            platform: windows-x64
            flags: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      CHIBI_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libopengl0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Unit and integration tests
        run: python -m unittest discover -s tests
      - name: Build and test standalone application
        run: python scripts/build_release.py ${{ matrix.flags }}
      - name: Upload tested packages
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.zip
            release/*.tar.gz
            release/*.deb
            release/build-*.json
  draft-release:
    name: Prepare draft release
    if: github.event_name != 'pull_request' && (github.ref_type == 'tag' || github.ref_name == 'main')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Attach builds to a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py --artifacts release --commit "$GITHUB_SHA"
